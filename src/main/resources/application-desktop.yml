spring:
  datasource:
    url: jdbc:h2:file:${user.home}/.stock-lens/data/stock-analyzer;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

server:
  address: 127.0.0.1
  port: 8082

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: ${user.home}/.stock-lens/logs/stock-lens.log

stock:
  desktop:
    enabled: true
